[tox]
envlist = py310, py311, py312, py313, py314

[gh-actions]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311
    3.10: py310

[testenv]
extras = otel, sentry, prometheus
runner = uv-venv-lock-runner
uv_python_preference = managed
commands =
    pytest --quiet --junitxml=pytest.xml

[testenv:py310]
# Python 3.10 - exclude Python 3.11+ specific tests
basepython = python3.10
commands =
    pytest --quiet --junitxml=pytest.xml -m "not py311_plus and not py312_plus"
